services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nagihin
      POSTGRES_PASSWORD: nagihin
      POSTGRES_DB: nagihin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nagihin -d nagihin']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://nagihin:nagihin@postgres:5432/nagihin
      DIRECT_DATABASE_URL: postgresql://nagihin:nagihin@postgres:5432/nagihin
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      DIRECT_DATABASE_URL: postgresql://nagihin:nagihin@postgres:5432/nagihin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
